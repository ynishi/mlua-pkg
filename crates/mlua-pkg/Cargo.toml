[package]
name = "mlua-pkg"
version = "0.6.0"
edition = "2021"
authors = ["Yutaka Nishimura"]
description = "Composable Lua module loader for mlua"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ynishi/mlua-pkg"
readme = "../../README.md"
keywords = ["lua", "mlua", "require", "module", "loader"]
categories = ["game-development", "config"]
rust-version = "1.85"
include = ["src/**/*", "tests/**/*", "LICENSE-*"]

[features]
sandbox-cap-std = ["dep:cap-std"]

[[bin]]
name = "mlua-pkg"
path = "src/bin/mlua-pkg.rs"

[[bin]]
name = "cargo-mlua-pkg"
path = "src/bin/mlua-pkg.rs"

[dependencies]
anyhow = "1"
cap-std = { version = "4", optional = true }
clap = { version = "4", features = ["derive"] }
git2 = "0.18"
mlua = { version = "0.11", features = ["lua54", "vendored", "serialize"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
toml_edit = "0.22"

[dev-dependencies]
cap-std = "4"
tempfile = "3"
